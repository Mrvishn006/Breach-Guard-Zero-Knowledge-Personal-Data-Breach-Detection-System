<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background / Shield Gradients -->
    <!-- Metallic Outer Rim Gradient -->
    <linearGradient id="shieldRim" x1="64" y1="40" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="75%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Dark Obsidian / Navy Inner Plate -->
    <linearGradient id="shieldInner" x1="256" y1="56" x2="256" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="35%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Orange / Gold Security Energy Accent -->
    <linearGradient id="orangeGlow" x1="120" y1="80" x2="392" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Metallic Silver 'B' Gradient -->
    <linearGradient id="bMetallic" x1="160" y1="130" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F1F5F9" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Inner 'B' Cutout Shadow / Contrast -->
    <linearGradient id="bCutout" x1="256" y1="150" x2="256" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Green Protection Shield Gradient -->
    <linearGradient id="greenShield" x1="330" y1="330" x2="450" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Top Gloss Specular Highlight -->
    <linearGradient id="specularGloss" x1="256" y1="56" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#EA580C" flood-opacity="0.25" />
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Outer Concentric Glowing Orbital Ring -->
  <circle cx="256" cy="256" r="236" stroke="#FDBA74" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="256" cy="256" r="246" stroke="#F97316" stroke-width="3" opacity="0.35" />
  <circle cx="256" cy="256" r="226" stroke="#FEF3C7" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Orbital Energy Nodes -->
  <circle cx="256" cy="10" r="6" fill="#F59E0B" />
  <circle cx="492" cy="256" r="6" fill="#F97316" />
  <circle cx="20" cy="256" r="6" fill="#EA580C" />
  <circle cx="256" cy="502" r="6" fill="#F59E0B" />

  <!-- 2. Main 3D Shield Body (Outer Metallic Bevel & Shadow) -->
  <g filter="url(#outerShadow)">
    <!-- Base Beveled Rim -->
    <path 
      d="M256 46 L432 108 C432 278 350 398 256 468 C162 398 80 278 80 108 L256 46 Z" 
      fill="url(#shieldRim)" 
    />

    <!-- Inner Metallic Inset Lip -->
    <path 
      d="M256 58 L420 116 C420 270 342 384 256 450 C170 384 92 270 92 116 L256 58 Z" 
      fill="#475569" 
    />

    <!-- Dark Obsidian / Navy Center Plate -->
    <path 
      d="M256 68 L408 124 C408 262 334 370 256 434 C178 370 104 262 104 124 L256 68 Z" 
      fill="url(#shieldInner)" 
    />
  </g>

  <!-- 3. Internal Orange/Gold Energy Halo -->
  <path 
    d="M256 82 L394 132 C394 254 326 352 256 414 C186 352 118 254 118 132 L256 82 Z" 
    stroke="url(#orangeGlow)" 
    stroke-width="3.5" 
    fill="none" 
    opacity="0.85"
  />

  <!-- 4. Stylized 3D Metallic "B" Emblem in Center -->
  <g filter="url(#innerGlow)">
    <!-- Orange Core Underglow for 'B' -->
    <path 
      d="M174 136 H296 C344 136 376 164 376 206 C376 236 356 256 326 264 C364 274 388 300 388 340 C388 388 350 418 298 418 H174 V136 Z" 
      fill="url(#orangeGlow)" 
      opacity="0.4"
    />

    <!-- Main Metallic 'B' Outer Silhouette -->
    <!-- Left Vertical Spine -->
    <rect x="180" y="142" width="46" height="268" rx="23" fill="url(#bMetallic)" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Top Loop -->
    <path 
      d="M206 142 H296 C336 142 364 166 364 204 C364 240 336 262 296 262 H206 V142 Z" 
      fill="url(#bMetallic)" 
      stroke="#FFFFFF" 
      stroke-width="1.5"
    />
    <!-- Top Loop Inner Cutout -->
    <path 
      d="M226 174 H290 C312 174 328 186 328 204 C328 222 312 232 290 232 H226 V174 Z" 
      fill="url(#bCutout)" 
      stroke="url(#orangeGlow)" 
      stroke-width="2"
    />

    <!-- Bottom Loop (Reinforced / Larger) -->
    <path 
      d="M206 252 H306 C348 252 376 278 376 322 C376 368 348 398 306 398 H206 V252 Z" 
      fill="url(#bMetallic)" 
      stroke="#FFFFFF" 
      stroke-width="1.5"
    />
    <!-- Bottom Loop Inner Cutout -->
    <path 
      d="M226 284 H300 C324 284 340 298 340 322 C340 346 324 364 300 364 H226 V284 Z" 
      fill="url(#bCutout)" 
      stroke="url(#orangeGlow)" 
      stroke-width="2"
    />

    <!-- Security Core Node -->
    <circle cx="266" cy="257" r="9" fill="#FFFFFF" />
    <circle cx="266" cy="257" r="5" fill="#F97316" />
  </g>

  <!-- 5. Top Specular Gloss Arc on Shield -->
  <path 
    d="M256 70 L400 122 C370 220 310 260 256 270 C202 260 142 220 112 122 L256 70 Z" 
    fill="url(#specularGloss)" 
    opacity="0.8"
  />

  <!-- 6. Small Green Verified Protection Shield / Badge (Bottom Right) -->
  <g filter="url(#badgeShadow)">
    <!-- Mini Shield Base -->
    <path 
      d="M392 342 L460 366 C460 426 430 464 392 488 C354 464 324 426 324 366 L392 342 Z" 
      fill="url(#greenShield)" 
      stroke="#A7F3D0" 
      stroke-width="3"
    />

    <!-- Mini Shield Specular Rim -->
    <path 
      d="M392 348 L452 370 C452 420 426 454 392 476 C358 454 332 420 332 370 L392 348 Z" 
      stroke="#ECFDF5" 
      stroke-width="1" 
      fill="none" 
      opacity="0.6"
    />

    <!-- Verified White Checkmark -->
    <path 
      d="M366 414 L384 432 L422 390" 
      stroke="#FFFFFF" 
      stroke-width="6" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>
</svg>
