<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" className="w-full h-full">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="bgShieldGrad" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="bgInnerGrad" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>

    <linearGradient id="bgGlowGrad" x1="24" y1="0" x2="24" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </linearGradient>

    <filter id="bgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EA580C" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Protective Guard Ring -->
  <circle cx="24" cy="24" r="22" stroke="#FDBA74" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6" />
  <circle cx="24" cy="24" r="23.5" stroke="#FB923C" stroke-width="0.75" opacity="0.3" />

  <!-- Outer Shield Geometry with Soft Glow -->
  <path 
    d="M24 4.5L38 10.5C38 23.5 31.5 35 24 43.5C16.5 35 10 23.5 10 10.5L24 4.5Z" 
    fill="url(#bgShieldGrad)" 
    filter="url(#bgShadow)"
  />

  <!-- Subtle Shield Highlight Rim -->
  <path 
    d="M24 6.2L36.2 11.5C36.2 22.8 30.5 33.2 24 41C17.5 33.2 11.8 22.8 11.8 11.5L24 6.2Z" 
    stroke="#FFEDD5" 
    stroke-width="0.8" 
    opacity="0.4"
    fill="none"
  />

  <!-- Stylized Geometric "B" & Keyhole / Core Node -->
  <!-- Left Spine of "B" -->
  <rect x="17" y="14" width="3.5" height="20" rx="1.75" fill="url(#bgInnerGrad)" />
  
  <!-- Upper Loop of "B" -->
  <path 
    d="M19 14H26.5C29.5 14 31.5 15.8 31.5 18.5C31.5 21.2 29.5 23 26.5 23H19V14Z" 
    fill="url(#bgInnerGrad)"
  />
  <path 
    d="M20.5 16.5H26C27.8 16.5 29 17.3 29 18.5C29 19.7 27.8 20.5 26 20.5H20.5V16.5Z" 
    fill="#EA580C"
  />

  <!-- Lower Loop of "B" (Extended & Reinforced) -->
  <path 
    d="M19 22H27.5C30.8 22 33 24 33 27C33 30 30.8 32 27.5 32H19V22Z" 
    fill="url(#bgInnerGrad)"
  />
  <path 
    d="M20.5 24.5H26.8C28.8 24.5 30.2 25.5 30.2 27C30.2 28.5 28.8 29.5 26.8 29.5H20.5V24.5Z" 
    fill="#EA580C"
  />

  <!-- Center Security Lock Node / Dot -->
  <circle cx="24" cy="23.5" r="1.2" fill="#FFFFFF" />
</svg>
